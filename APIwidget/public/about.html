<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About APIwidget</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #121212;
      color: rgba(255, 255, 255, 0.87);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }

    .version {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 24px;
    }

    .description {
      font-size: 16px;
      line-height: 1.5;
      max-width: 320px;
      margin-bottom: 24px;
    }

    .copyright {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .links {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }

    .link {
      color: #90caf9;
      text-decoration: none;
      font-size: 14px;
    }

    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <img src="./images/256x256logo.png" alt="APIwidget Logo" class="logo" id="logo">
  <h1>APIwidget</h1>
  <div class="version" id="version">Version 1.0.0</div>
  <p class="description">
    A modern, floating widget for tracking API costs in real-time.
    Monitor your API usage and costs with a beautiful, unobtrusive interface.
  </p>
  <div class="links">
    <a href="#" class="link" id="website">Website</a>
    <a href="#" class="link" id="github">GitHub</a>
    <a href="#" class="link" id="support">Support</a>
  </div>
  <div class="copyright">
    © 2024 APIwidget. All rights reserved.
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.electronAPI) {
        try {
          // Get app version
          const version = await window.electronAPI.getVersion();
          document.getElementById('version').textContent = `Version ${version}`;

          // Set up links
          document.getElementById('website').addEventListener('click', (e) => {
            e.preventDefault();
            window.electronAPI.openExternal('https://apiwidget.com');
          });

          document.getElementById('github').addEventListener('click', (e) => {
            e.preventDefault();
            window.electronAPI.openExternal('https://github.com/apiwidget/apiwidget');
          });

          document.getElementById('support').addEventListener('click', (e) => {
            e.preventDefault();
            window.electronAPI.openExternal('mailto:support@apiwidget.com');
          });
        } catch (error) {
          console.error('Error loading about page data:', error);
        }
      }
    });
  </script>
</body>
</html>
