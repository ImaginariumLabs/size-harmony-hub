<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APIwidget</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Inter', 'Roboto', 'Helvetica', 'Arial', sans-serif;
    }

    #widget-root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="widget-root"></div>
  <!-- Development mode entry point -->
  <script type="module" src="/src/widget.tsx"></script>

  <!-- Fallback widget bundle -->
  <script src="./widget-bundle.js"></script>

  <!-- Production mode fallback -->
  <script>
    // Check if the widget component loaded successfully
    window.addEventListener('load', function() {
      setTimeout(function() {
        const widgetRoot = document.getElementById('widget-root');
        if (widgetRoot && widgetRoot.children.length === 0) {
          console.warn('Widget component did not load, using fallback');

          // Create a simple fallback widget
          widgetRoot.innerHTML = `
            <div style="
              background: rgba(30, 30, 30, 0.7);
              backdrop-filter: blur(10px);
              border-radius: 12px;
              padding: 15px;
              color: white;
              font-family: Arial, sans-serif;
              box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
              width: 100%;
              height: 100%;
              box-sizing: border-box;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
            ">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 14px;">OpenAI API USAGE</h3>
                <div style="display: flex; gap: 8px;">
                  <button style="
                    width: 16px;
                    height: 16px;
                    border-radius: 50%;
                    border: none;
                    background: #10a37f;
                    cursor: pointer;
                  "></button>
                </div>
              </div>

              <div style="text-align: center; margin: 15px 0;">
                <p style="font-size: 24px; font-weight: bold; margin: 0;">$45.28</p>
                <p style="color: #4caf50; margin: 5px 0;">
                  <span>↑</span> $2.15 (4.9%)
                </p>
              </div>

              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 12px; opacity: 0.7;">Updated: just now</div>
              </div>
            </div>
          `;
        }
      }, 1000); // Wait 1 second to check if the component loaded
    });
  </script>
</body>
</html>
